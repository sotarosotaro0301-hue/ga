<!DOCTYPE html> <html lang=“ja”> <head> <meta charset=“UTF-8”> <meta name=“viewport”content=“width=device-width, initial-scale=1.0”> <title>My Brawl Browser</title> <style> body { margin: 0; font-family: sans-serif; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; height: 100vh; } .bar { display: flex; padding: 8px; background: #16213e; gap: 6px; } input { flex: 1; padding: 8px; border-radius: 6px; border: none; font-size: 16px; } button { padding: 8px 12px; border-radius: 6px; border: none; background: #e94560; color: #fff; font-weight: bold; font-size: 14px; } .presets { display: flex; gap: 6px; padding: 6px 8px; background: #0f3460; overflow-x: auto; } .preset-btn { background: #f39c12; color: #000; white-space: nowrap; font-size: 13px; padding: 6px 10px; } iframe { flex: 1; width: 100%; border: none; background: #000; } </style> </head> <body> <div class=“bar”> <inputtype=“text” id=“urlInput” placeholder=“URLを入力”> <button onclick=“openDirect()”>直接移動</button> </div> <!— ブロスタ関連のショートカット —> <div class=“presets”> <buttonclass=“preset-btn”onclick=“window.location.href=‘https://web.cloudmoonapp.com/ja/game/com.supercell.brawlstars/‘”>ブロスタ (CloudMoon)</button> <button class=“preset-btn”onclick=“window.location.href=‘https://www.easyfun.gg/jp/cloud-games/brawl-stars.html’”>ブロスタ (EasyFun)</button> </div> <iframe id=“browserFrame” src=“about:blank”></iframe> <
script> function openDirect() { let url = document.getElementById(‘urlInput’).value.trim(); if (!url) return; if (!url.startsWith(‘http://‘) && !url.startsWith(‘https://‘)) { url = ‘https://‘ + url; } window.location.href = url; } </script> </body> </html>
